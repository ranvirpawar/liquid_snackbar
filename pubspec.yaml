name: liquid_snackbar
description: Polished glass snackbars and compact toasts with bounded queues, safe lifecycle management, accessible actions, and Flutter-only dependencies.
version: 0.1.3
repository: https://github.com/ranvirpawar/liquid_snackbar
issue_tracker: https://github.com/ranvirpawar/liquid_snackbar/issues
environment:
  sdk: '>=3.11.4 <4.0.0'
  flutter: '>=3.41.6'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
topics:
  - snackbar
  - toast
  - glass
  - accessibility
  - animation
screenshots:
  - description: Promotional concept showing glossy notification variants and a compact pill.
    path: doc/promotional/liquid-snackbar-promo-v1.png
  - description: Promotional concept showing glass feedback in a fictional iOS-style app.
    path: doc/promotional/liquid-snackbar-mobile-v1.png

# Verified builds and browser checks: see VALIDATION.md.
platforms:
  android:
  ios:
  web:
  windows:
